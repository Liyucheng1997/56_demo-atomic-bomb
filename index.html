<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原子弹结构与威力可视化 · Three.js</title>
<style>
  :root{
    --bg:#05070d; --panel:rgba(14,20,33,.86); --line:#1d2940;
    --accent:#ff8a3d; --accent2:#4dd0ff; --danger:#ff4d4d; --txt:#e6edf6; --dim:#8da2bd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #panel{position:fixed;top:16px;left:16px;width:330px;max-height:calc(100vh - 32px);
    overflow-y:auto;background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:14px;padding:18px 18px 22px;z-index:10}
  #panel::-webkit-scrollbar{width:7px}
  #panel::-webkit-scrollbar-thumb{background:#243352;border-radius:6px}
  h1{font-size:18px;letter-spacing:.5px;margin-bottom:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:11px;color:var(--dim);margin-bottom:14px}
  .group{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}
  .group h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin-bottom:9px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  button{font:inherit;font-size:12px;color:var(--txt);background:#16203a;border:1px solid var(--line);
    padding:7px 11px;border-radius:8px;cursor:pointer;transition:.15s;flex:1;min-width:0}
  button:hover{border-color:var(--accent2);background:#1c2a48}
  button.active{background:linear-gradient(135deg,var(--accent),#ff6a3d);border-color:transparent;color:#1a0f06;font-weight:600}
  .row{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px}
  .row label{flex:1;color:var(--dim)}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .val{width:54px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer;margin:7px 0}
  .toggle input{accent-color:var(--accent2);width:15px;height:15px}
  .big{width:100%;font-size:14px;padding:11px;margin-top:6px;flex:none;
    background:linear-gradient(135deg,var(--danger),#ff7a2d);border:none;color:#fff;font-weight:700;letter-spacing:1px}
  .big:hover{filter:brightness(1.12)}
  .big.reset{background:#16203a;color:var(--txt);border:1px solid var(--line);font-weight:500;letter-spacing:0}
  .big.mush{background:linear-gradient(135deg,#7a6a55,#b9a07a);color:#1a130a}

  #info{position:fixed;top:16px;right:16px;width:290px;background:var(--panel);
    backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:10}
  #info h3{font-size:14px;color:var(--accent);margin-bottom:4px}
  #info .en{font-size:11px;color:var(--dim);margin-bottom:9px}
  #info p{font-size:12px;line-height:1.65;color:#c4d2e6}
  #info .spec{margin-top:9px;font-size:11px;color:var(--dim)}
  #info .spec b{color:var(--accent2)}

  #stage{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:30px;padding:9px 20px;font-size:12px;z-index:10;display:flex;align-items:center;gap:12px;white-space:nowrap}
  #stage .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  #stage.live .dot{background:var(--danger);box-shadow:0 0 12px var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  #stageTxt{color:var(--txt)}
  #clock{color:var(--accent);font-variant-numeric:tabular-nums;min-width:78px}

  .label{position:absolute;font-size:11px;color:var(--txt);background:rgba(8,12,22,.78);
    border:1px solid var(--line);padding:3px 8px;border-radius:6px;pointer-events:none;
    transform:translate(-50%,-50%);white-space:nowrap;transition:opacity .2s}
  .label b{color:var(--accent2)}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:5}

  .hint{position:fixed;bottom:18px;right:18px;font-size:11px;color:var(--dim);z-index:10}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="flash"></div>

<div id="panel">
  <h1>核裂变武器可视化</h1>
  <div class="sub" id="subTitle">内爆式钚弹 (Fat Man 型) · 交互式三维模型</div>

  <div class="group">
    <h2>弹型</h2>
    <div class="seg" id="bombTypes">
      <button data-type="fatman" class="active">内爆式 · 胖子</button>
      <button data-type="littleboy">枪式 · 小男孩</button>
    </div>
  </div>

  <div class="group">
    <h2>视图模式</h2>
    <div class="seg" id="viewModes">
      <button data-view="full" class="active">整体</button>
      <button data-view="cut">剖面</button>
      <button data-view="explode">分解</button>
    </div>
  </div>

  <div class="group">
    <h2>结构层 (点击隔离观察)</h2>
    <div class="seg" style="flex-direction:column" id="layerBtns"></div>
  </div>

  <div class="group">
    <h2>引爆序列</h2>
    <button class="big" id="detonate">⚛ 起爆 DETONATE</button>
    <div class="row"><label>动画速度</label>
      <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
      <span class="val" id="speedV">1.0×</span></div>
    <button class="big mush" id="mushBtn">🍄 蘑菇云</button>
    <button class="big reset" id="reset">重置序列</button>
  </div>

  <div class="group">
    <h2>威力 / 当量</h2>
    <div class="row"><label>当量 (kt TNT)</label>
      <input type="range" id="yield" min="1" max="1000" step="1" value="21">
      <span class="val" id="yieldV">21</span></div>
    <button class="big reset" id="blast">显示杀伤半径</button>
    <div class="row" style="margin-top:4px"><label class="toggle">
      <input type="checkbox" id="autoRotate"> 自动旋转</label></div>
  </div>
</div>

<div id="info">
  <h3 id="iTitle">内爆式核装置</h3>
  <div class="en" id="iEn">Implosion-type fission device</div>
  <p id="iDesc">拖动旋转查看，滚轮缩放。点击左侧结构层可单独隔离观察各部件，或切换“剖面 / 分解”视图理解内部构造。准备好后点击“起爆”观看完整引爆链。</p>
  <div class="spec" id="iSpec"></div>
</div>

<div id="stage"><span class="dot"></span><span id="stageTxt">就绪 · 待命</span><span id="clock">T 0.0 µs</span></div>
<div class="hint">鼠标拖动旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{ "imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================ 场景 ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.localClippingEnabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.FogExp2(0x05070d, 0.00055);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 8000);
camera.position.set(130, 75, 175);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.target.set(0,4,0);

scene.add(new THREE.AmbientLight(0x405070, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(80,120,60); scene.add(key);
const rim = new THREE.DirectionalLight(0x4dd0ff, 0.7); rim.position.set(-90,30,-70); scene.add(rim);
const fill = new THREE.PointLight(0xff8a3d, 0.5, 600); fill.position.set(0,-40,80); scene.add(fill);

(function stars(){
  const g=new THREE.BufferGeometry(); const n=1400,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=1400+Math.random()*2600,t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6b7da0,size:1.4,sizeAttenuation:false})));
})();

const clip = new THREE.Plane(new THREE.Vector3(0,0,-1), 1000); // 剖面裁剪
const groundY = -70;

function makeMat(color, opts={}){
  return new THREE.MeshStandardMaterial(Object.assign({
    color, metalness:.55, roughness:.4, clippingPlanes:[clip], clipShadows:true, side:THREE.DoubleSide
  }, opts));
}

/* ============================================================ 通用炸弹容器 ============================================================ */
const root = new THREE.Group(); scene.add(root);
let active = null;          // 当前激活弹型对象
let isolated = null;
let view = 'full';
let explodeAmt = 0;

/* ============================================================ ① 内爆式 · 胖子 ============================================================ */
function buildFatMan(){
  const group = new THREE.Group(); group.visible=false; root.add(group);
  const layers = [];
  const R = { casing:46, lens:38, push:30, tamper:25, pit:16, init:5 };
  const add=(cfg)=>{ cfg.mesh.userData=cfg; group.add(cfg.mesh); cfg.home=cfg.mesh.position.clone(); layers.push(cfg); };

  // 外壳 (椭球)
  let g=new THREE.SphereGeometry(R.casing,64,48); g.scale(1,1.28,1);
  let m=makeMat(0x3a4252,{metalness:.7,roughness:.35,transparent:true});
  add({key:'casing',name:'弹道外壳 / 弹体',en:'Ballistic Casing',mesh:new THREE.Mesh(g,m),mat:m,outR:R.casing*1.28,explodeDir:new THREE.Vector3(0,1,0),
    desc:'高强度钢制气动外壳，保护内部精密装置并赋予炸弹稳定弹道。"胖子" 弹体直径约 1.5 m，重约 4.6 吨。外壳不参与核反应，仅起承载与气动作用。',
    spec:'材料 <b>高强度钢</b> · 直径 <b>~1.5 m</b> · 全重 <b>~4.6 t</b>'});
  // 尾翼
  {const fg=new THREE.BoxGeometry(2,26,22),fm=makeMat(0x2c333f,{metalness:.6});
   for(let i=0;i<4;i++){const f=new THREE.Mesh(fg,fm),a=i*Math.PI/2;f.position.set(Math.cos(a)*40,-52,Math.sin(a)*40);f.lookAt(0,-52,0);f.rotateY(Math.PI/2);group.add(f);}}
  // 炸药透镜 ×32
  const lensGroup=new THREE.Group();
  let lm=makeMat(0xb56b2e,{metalness:.15,roughness:.75,emissive:0x000000});
  lensGroup.add(new THREE.Mesh(new THREE.SphereGeometry(R.lens,48,32),lm));
  lensGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(R.lens+0.25,1),
    new THREE.MeshBasicMaterial({color:0x000000,wireframe:true,transparent:true,opacity:.35,clippingPlanes:[clip]})));
  add({key:'lens',name:'高能炸药透镜 ×32',en:'Explosive Lenses',mesh:lensGroup,mat:lm,outR:R.lens,explodeDir:new THREE.Vector3(0.9,0.5,0).normalize(),
    desc:'32 块精密铸造的炸药“透镜”，由快速与慢速炸药组合而成。它们将向外发散的爆轰波重塑为完美的、向心汇聚的球面冲击波——这是内爆法的技术核心。所有透镜必须在微秒级同步起爆。',
    spec:'炸药 <b>Composition B / Baratol</b> · 块数 <b>32</b> · 同步精度 <b>&lt; 1 µs</b>'});
  // 铝推进层
  m=makeMat(0x9aa3ad,{metalness:.85,roughness:.3});
  add({key:'push',name:'铝推进层',en:'Aluminium Pusher',mesh:new THREE.Mesh(new THREE.SphereGeometry(R.push,48,32),m),mat:m,outR:R.push,explodeDir:new THREE.Vector3(-0.9,0.4,0.2).normalize(),
    desc:'位于炸药与铀反射层之间的铝合金壳。它平滑爆轰冲击波、抑制瑞利–泰勒不稳定性，使冲击波更均匀地传入致密的铀层，避免内爆失对称。',
    spec:'材料 <b>铝合金</b> · 作用 <b>整形冲击波 / 抑制不稳定性</b>'});
  // 铀夯实层
  m=makeMat(0x55606e,{metalness:.9,roughness:.25});
  add({key:'tamper',name:'铀-238 反射 / 夯实层',en:'U-238 Tamper',mesh:new THREE.Mesh(new THREE.SphereGeometry(R.tamper,48,32),m),mat:m,outR:R.tamper,explodeDir:new THREE.Vector3(0.3,-0.9,0.3).normalize(),
    desc:'高密度天然铀(U-238)外壳。双重作用：① 凭惯性“夯住”爆炸中的核心，延长其维持超临界的时间；② 把逃逸的中子反射回核心，提高反应效率。部分 U-238 还会被快中子裂变，额外贡献当量。',
    spec:'材料 <b>U-238</b> · 作用 <b>惯性约束 + 中子反射</b>'});
  // 钚核
  m=makeMat(0x6fae7a,{metalness:.95,roughness:.18,emissive:0x0c2410,emissiveIntensity:.4});
  add({key:'pit',name:'钚-239 核心',en:'Plutonium Pit',mesh:new THREE.Mesh(new THREE.SphereGeometry(R.pit,48,32),m),mat:m,outR:R.pit,explodeDir:new THREE.Vector3(0,0,1),
    desc:'武器级钚-239 制成的次临界球(约 6.2 kg)。常态密度不足以维持链式反应。内爆冲击波将其瞬间压缩至约两倍密度，越过临界点进入“超临界”，引发指数增长的裂变链式反应——这就是爆炸的能量之源。',
    spec:'材料 <b>Pu-239 (武器级)</b> · 质量 <b>~6.2 kg</b> · 压缩 <b>≈2× 密度</b>'});
  // 中子源
  m=makeMat(0xffe14d,{metalness:.4,roughness:.3,emissive:0x4a3a00,emissiveIntensity:.6});
  add({key:'init',name:'中子引爆源 (海胆)',en:'Neutron Initiator',mesh:new THREE.Mesh(new THREE.SphereGeometry(R.init,32,24),m),mat:m,outR:R.init,explodeDir:new THREE.Vector3(0,0,-1),
    desc:'位于正中心的钋-210/铍中子源。当冲击波到达、核心被压缩到超临界的“黄金时刻”，它被挤压并瞬间释放大量自由中子，作为链式反应的“火花塞”——精确点燃整个裂变过程，避免提前哑爆。',
    spec:'材料 <b>Po-210 + Be</b> · 作用 <b>精准触发链式反应</b>'});

  // 中心闪光 / 冲击波
  const core=new THREE.Mesh(new THREE.SphereGeometry(R.init,32,24),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending}));
  group.add(core);
  const coreLight=new THREE.PointLight(0xfff0c0,0,1600,2); core.add(coreLight);
  const shock=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),new THREE.MeshBasicMaterial({color:0xff7a2d,transparent:true,opacity:0,side:THREE.BackSide,blending:THREE.AdditiveBlending}));
  group.add(shock);

  const labelDefs=[{key:'casing',pos:new THREE.Vector3(0,58,0)},{key:'lens',pos:new THREE.Vector3(-38,8,0)},
    {key:'tamper',pos:new THREE.Vector3(25,-14,8)},{key:'pit',pos:new THREE.Vector3(10,10,12)},{key:'init',pos:new THREE.Vector3(0,0,0)}];

  const phases=[{t:0,txt:'雷管同步引爆 · 32 透镜点火'},{t:1.2,txt:'爆轰波向心汇聚'},{t:2.4,txt:'冲击波压缩核心 → 超临界'},
    {t:3.0,txt:'中子源触发 · 链式反应点燃'},{t:3.4,txt:'裂变链指数增长 · 能量释放'},{t:4.2,txt:'火球形成 · 弹体气化'}];

  function seq(t){
    const lens=layers.find(l=>l.key==='lens'), pit=layers.find(l=>l.key==='pit');
    if(t<2.6){
      const k=THREE.MathUtils.clamp((t-0.4)/2.0,0,1);
      shock.material.opacity=0.5*(1-Math.abs(k-0.5)*1.4);
      shock.scale.setScalar(Math.max(THREE.MathUtils.lerp(R.lens,R.init,k),0.5));
      lens.mat.emissive.set(0xff5a1e); lens.mat.emissiveIntensity=Math.max(0,0.8*(1-t/2.5));
    } else shock.material.opacity=0;
    if(t>1.8&&t<3.0){const c=THREE.MathUtils.clamp((t-1.8)/1.2,0,1);pit.mesh.scale.setScalar(1-0.32*c);pit.mat.emissiveIntensity=0.4+2*c;}
    if(t>=3.0){
      const gg=THREE.MathUtils.clamp((t-3.0)/1.4,0,1);
      core.material.opacity=gg; core.scale.setScalar(1+gg*gg*60);
      coreLight.intensity=gg*gg*4000; coreLight.color.setHSL(0.09-0.06*gg,1,0.6);
      layers.forEach(L=>{if(L.key!=='init'){L.mat.opacity=Math.max(0,1-gg*1.1);L.mat.emissive.set(0xffaa44);L.mat.emissiveIntensity=gg*1.5;}});
      if(t>=3.3) setFlash(Math.max(0,0.9*(1-(t-3.3)/0.6)));
    }
    if(t>=4.2){const f=t-4.2;core.scale.setScalar(60+f*120);core.material.opacity=Math.max(0,0.9-f*0.25);coreLight.intensity=Math.max(0,4000-f*900);coreLight.color.setHSL(0.08,1,0.5);}
    return t>4.6; // 触发蘑菇云时刻
  }
  function resetVisual(){
    core.material.opacity=0; coreLight.intensity=0; core.scale.setScalar(1);
    shock.material.opacity=0; shock.scale.setScalar(1);
    layers.forEach(L=>{L.mesh.scale.setScalar(1);L.mat.emissiveIntensity=(L.key==='pit')?.4:(L.key==='init')?.6:0;L.mat.emissive.set((L.key==='pit')?0x0c2410:(L.key==='init')?0x4a3a00:0x000000);});
  }
  return {type:'fatman',group,layers,labelDefs,phases,seq,resetVisual,defaultKey:'pit',
    sub:'内爆式钚弹 (Fat Man 型) · 交互式三维模型',infoTitle:'内爆式核装置',infoEn:'Implosion-type fission device'};
}

/* ============================================================ ② 枪式 · 小男孩 ============================================================ */
function buildLittleBoy(){
  const group=new THREE.Group(); group.visible=false; root.add(group);
  const layers=[];
  const add=(cfg)=>{cfg.mesh.userData=cfg;group.add(cfg.mesh);cfg.home=cfg.mesh.position.clone();layers.push(cfg);};
  // 枪式为细长弹体，沿 Y 轴竖直。 上=尾(发射药/弹丸) 下=头(靶环)
  const H=130;                 // 弹体半长
  const targetY=-70, projHomeY=62;  // 靶位 / 弹丸初始位置

  // 外壳 (圆柱 + 头锥 + 尾)
  const cas=new THREE.Group();
  let m=makeMat(0x3a4252,{metalness:.7,roughness:.35,transparent:true});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(26,26,H*1.55,48,1,true),m); cas.add(body);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(26,40,48),m); nose.position.y=-H*0.9; cas.add(nose);
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(26,20,30,48),m); tail.position.y=H*0.85; cas.add(tail);
  add({key:'casing',name:'弹道外壳 / 弹体',en:'Ballistic Casing',mesh:cas,mat:m,outR:30,explodeDir:new THREE.Vector3(1,0,0),
    desc:'细长气动钢壳，长约 3 m、直径 0.7 m，内部本质是一门“炮”。"小男孩" 全重约 4.4 吨，外壳赋予气动外形并容纳枪管组件。',
    spec:'长 <b>~3 m</b> · 直径 <b>~0.7 m</b> · 全重 <b>~4.4 t</b>'});
  // 尾翼
  {const fg=new THREE.BoxGeometry(2,26,24),fm=makeMat(0x2c333f,{metalness:.6});
   for(let i=0;i<4;i++){const f=new THREE.Mesh(fg,fm),a=i*Math.PI/2;f.position.set(Math.cos(a)*22,H*0.95,Math.sin(a)*22);f.lookAt(0,H*0.95,0);f.rotateY(Math.PI/2);group.add(f);}}

/* ============================================================ 蘑菇云 (粒子) ============================================================ */
const mushroom = (function(){
  const N=2200;
  const pos=new Float32Array(N*3), col=new Float32Array(N*3);
  // 每粒子参数
  const P=[];
  for(let i=0;i<N;i++){
    const cap = Math.random()<0.62;          // 62% 在云盖, 其余在云柱
    const a=Math.random()*Math.PI*2;
    const dir=new THREE.Vector3().setFromSphericalCoords(1, Math.acos(THREE.MathUtils.lerp(0.15,1,Math.random())), a); // 偏上半球
    P.push({cap,a,hf:Math.random(),rf:0.35+0.65*Math.random(),phase:Math.random()*6.28,dir,jit:0.6+0.8*Math.random()});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  // 软粒子贴图
  const cv=document.createElement('canvas');cv.width=cv.height=64;const cx=cv.getContext('2d');
  const gr=cx.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.4,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,64,64);
  const tex=new THREE.CanvasTexture(cv);
  const mat=new THREE.PointsMaterial({size:34,map:tex,vertexColors:true,transparent:true,opacity:.85,depthWrite:false,sizeAttenuation:true});
  const pts=new THREE.Points(geo,mat); pts.visible=false; scene.add(pts);
  const baseLight=new THREE.PointLight(0xff6a1e,0,1400,2); baseLight.position.set(0,groundY+40,0); scene.add(baseLight);

  const STEM=560, CAPC=600, CAPR=240, STEMR=42;
  let g=0, active=false, time=0;
  function start(){active=true;g=0;pts.visible=true;}
  function reset(){active=false;g=0;pts.visible=false;baseLight.intensity=0;}
  function update(dt){
    if(!active)return;
    time+=dt; g=Math.min(1,g+dt*0.22);
    const e=g*g*(3-2*g);                 // smoothstep 上升
    baseLight.intensity=Math.max(0, (1-g)*2600 );
    baseLight.color.setHSL(0.06,1,0.5);
    const pa=geo.attributes.position.array, ca=geo.attributes.color.array;
    for(let i=0;i<N;i++){
      const p=P[i]; let x,y,z;
      if(!p.cap){ // 云柱
        const h=e*STEM*(0.15+0.85*p.hf);
        const rr=STEMR*(0.55+0.5*p.rf)*(1+h/STEM*0.5);
        const sw=p.a + Math.sin(time*0.6+p.phase)*0.25 + h*0.004;
        x=Math.cos(sw)*rr; z=Math.sin(sw)*rr; y=groundY+h;
      } else {     // 云盖 (翻滚的环状菌盖)
        const capY=groundY+e*CAPC;
        const cr=e*CAPR*p.rf;
        const d=p.dir;
        x=d.x*cr*p.jit; z=d.z*cr*p.jit;
        // 菌盖呈扁球 + 边缘下卷
        const horiz=Math.sqrt(x*x+z*z)/(CAPR+1);
        y=capY + d.y*cr*0.55 - horiz*horiz*120 + Math.sin(time*0.8+p.phase)*6;
      }
      pa[i*3]=x; pa[i*3+1]=y; pa[i*3+2]=z;
      // 颜色: 低处偏暖暗, 高处偏亮灰; 早期整体发热
      const hh=(y-groundY)/(STEM+CAPC);
      const heat=Math.max(0,0.55-g)*1.6;   // 早期红热
      const base=0.30+0.42*hh;
      ca[i*3]  =Math.min(1, base+0.25 + heat);
      ca[i*3+1]=Math.min(1, base+0.10 + heat*0.4);
      ca[i*3+2]=Math.min(1, base);
    }
    geo.attributes.position.needsUpdate=true;
    geo.attributes.color.needsUpdate=true;
    mat.opacity = 0.9;
  }
  return {start,reset,update,get active(){return active;}};
})();

let camFocus=null;

/* ============================================================ 投影工具 ============================================================ */
function project(v){const p=v.clone().project(camera);return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight,vis:p.z<1};}

/* ============================================================ 主循环 ============================================================ */
const clk=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clk.getDelta(),0.05);
  controls.update();

  // 相机聚焦插值
  if(camFocus){
    controls.target.lerp(camFocus.target, Math.min(dt*2.5,1));
    if(camFocus.dist){
      const dir=camera.position.clone().sub(controls.target);
      const cur=dir.length(); dir.normalize();
      camera.position.copy(controls.target).add(dir.multiplyScalar(THREE.MathUtils.lerp(cur,camFocus.dist,Math.min(dt*2,1))));
    }
    if(controls.target.distanceTo(camFocus.target)<0.5) camFocus=null;
  }

  // 分解视图
  const tgt=(view==='explode'&&!seq.active)?1:0;
  explodeAmt+=(tgt-explodeAmt)*Math.min(dt*4,1);
  active.layers.forEach(L=>{const off=L.explodeDir.clone().multiplyScalar(explodeAmt*(L.outR*1.4+34));L.mesh.position.copy(L.home).add(off);});

  // 引爆序列
  if(seq.active){
    seq.t+=dt*1.6*seq.speed;
    clock.textContent='T '+seq.t.toFixed(1)+' µs';
    let cur=active.phases[0]; for(const p of active.phases) if(seq.t>=p.t) cur=p;
    stageTxt.textContent=cur.txt;
    const trigger=active.seq(seq.t);
    if(trigger && !seq.mushTriggered){ seq.mushTriggered=true; mushroom.start(); focusCamera(new THREE.Vector3(0,260,0),780); }
    if(seq.t>8.5){ seq.active=false; stageTxt.textContent='爆炸完成 · 点击“重置序列”'; }
  }
  mushroom.update(dt);

  // 轻微自转
  if(!controls.autoRotate&&!seq.active&&!showBlast&&!mushroom.active) active.group.rotation.y+=dt*0.08;

  // 结构标注
  const showStruct=(view!=='full'||isolated)&&!seq.active&&!showBlast&&!mushroom.active;
  structLabels.forEach(s=>{
    if(!showStruct){s.el.style.opacity=0;return;}
    const w=s.pos.clone().applyMatrix4(active.group.matrixWorld);const p=project(w);
    s.el.style.left=p.x+'px';s.el.style.top=p.y+'px';s.el.style.opacity=p.vis?1:0;
  });
  // 杀伤半径标注
  ringMeshes.forEach((r,i)=>{const el=ringLabels[i];
    if(!showBlast){el.style.opacity=0;return;}
    const rad=r.ring.scale.x;const w=new THREE.Vector3(0,groundY+1,rad);const p=project(w);
    el.innerHTML=`<b>${r.zone.name}</b> · ${r.ring.userData.km?.toFixed(2)} km`;
    el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.opacity=p.vis?1:0;
  });

  renderer.render(scene,camera);
}

switchBomb('fatman');
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
